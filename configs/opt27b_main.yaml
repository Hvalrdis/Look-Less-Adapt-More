model:
  arch: blip2_opt
  model_type: caption_coco_opt2.7b
  pretrained: null  # REQUIRED: set the local FFN-recovered checkpoint before training
  load_finetuned: false
  use_grad_checkpoint: true
  freeze_vit: true
  enable_qformer_l9_aux_ln: false

datasets:
  coco_caption:
    vis_processor:
      train: {name: blip2_image_train, image_size: 364}
      eval: {name: blip_image_eval, image_size: 364}
    text_processor:
      train: {name: blip_caption, prompt: "a photo of "}
      eval: {name: blip_caption}
    build_info:
      annotations:
        train: {storage: data/coco/annotations/coco_karpathy_train.json}
        val: {storage: data/coco/annotations/coco_karpathy_val.json}
        test: {storage: data/coco/annotations/coco_karpathy_test.json}
      images: {storage: data/coco/images}

run:
  task: captioning
  runner: runner_iter
  evaluate: false
  train_splits: [train]
  valid_splits: [val]
  test_splits: [test]
  device: cuda
  world_size: 1
  dist_url: env://
  distributed: false
  lr_sched: linear_warmup_cosine_lr
  init_lr: 1.0e-5
  min_lr: 1.0e-6
  warmup_lr: 1.0e-7
  warmup_steps: 50
  weight_decay: 0.02
  amp: true
  max_iters: 50
  iters_per_inner_epoch: 50
  val_freq: 1
  batch_size_train: 4
  batch_size_eval: 4
  num_workers: 0
  accum_grad_iters: 1
  max_len: 30
  min_len: 8
  num_beams: 5
  seed: 42
  output_dir: outputs/opt27b_main
  resume_ckpt_path: null

  # Paper protocol: gate-pruned FFN -> matched recovery -> head pruning.
  ffn_gate_enabled: false
  enable_qformer_pruning: false
  vision_token_prune_enabled: true
  vision_token_prune_mode: ratio
  vision_token_keep_ratio: 0.45
  vision_token_score_mode: attn_entropy
  vision_token_tail_strategy: merge
  vision_token_lagged_two_pass: true
  use_vision_head_cka: false
  text_kv_prune_enabled: false
  lowrank_enabled: false
  global_head_keep_ratio: 0.75
  min_heads_per_layer: 1
  score_mode: grad*act
  k_folds: 5
  importance_batches: 125
  importance_batch_size: 4
  export_slim_ckpt: false
