# Matched cross-backbone validation template for BLIP-2 FlanT5-XL.
# Appendix setting: pre-head recovery at visual-token keep ratio 0.70.
# This model is registered by upstream LAVIS as blip2_t5; the release overlay
# is OPT-focused, so use the upstream LAVIS 1.0.1 T5 modules for this template.
model:
  arch: blip2_t5
  model_type: caption_coco_flant5xl
  t5_model: google/flan-t5-xl
  pretrained: null  # Set to the local matched-recovery checkpoint.
  load_finetuned: false
  use_grad_checkpoint: true
  vit_model: eva_clip_g
  vit_precision: fp16
  freeze_vit: true
  num_query_token: 32
  prompt: "a photo of "

datasets:
  coco_caption:
    vis_processor:
      train: {name: blip2_image_train, image_size: 364}
      eval: {name: blip_image_eval, image_size: 364}
    text_processor:
      train: {name: blip_caption, prompt: "a photo of "}
      eval: {name: blip_caption}
    build_info:
      annotations:
        train: {storage: data/coco/annotations/coco_karpathy_train.json}
        val: {storage: data/coco/annotations/coco_karpathy_val.json}
        test: {storage: data/coco/annotations/coco_karpathy_test.json}
      images: {storage: data/coco/images}

run:
  task: captioning
  runner: runner_iter
  evaluate: false
  train_splits: [train]
  valid_splits: [val]
  test_splits: [test]
  device: cuda
  distributed: false
  lr_sched: linear_warmup_cosine_lr
  init_lr: 2.5e-6
  min_lr: 2.5e-7
  warmup_lr: 2.5e-8
  warmup_steps: 20
  weight_decay: 0.02
  amp: true
  max_iters: 450
  iters_per_inner_epoch: 450
  val_freq: 1
  batch_size_train: 8
  batch_size_eval: 8
  num_workers: 0
  accum_grad_iters: 2
  max_len: 30
  min_len: 8
  num_beams: 5
  seed: 42
  output_dir: outputs/flant5xl_cross_backbone
  resume_ckpt_path: null

  # Matched pre-head recovery metadata. The T5 implementation is upstream.
  ffn_gate_enabled: false
  enable_qformer_pruning: false
  vision_token_prune_enabled: true
  vision_token_prune_mode: ratio
  vision_token_keep_ratio: 0.70
  vision_token_score_mode: attn_entropy
  vision_token_tail_strategy: merge
  vision_token_lagged_two_pass: true
  use_vision_head_cka: false
  text_kv_prune_enabled: false
  lowrank_enabled: false
